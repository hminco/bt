[project]
name = "medical-seminar-ai-lab-backend"
version = "0.1.0"
description = "FastAPI prototype for seminar ingest, audio preparation, and timestamp transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "openai>=2.53,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "yt-dlp[default]>=2026.7.4,<2027",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
